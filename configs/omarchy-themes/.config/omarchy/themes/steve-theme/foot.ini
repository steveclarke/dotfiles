# Dark terminal colours (Catppuccin Mocha) against this theme's light desktop.
#
# steve-theme is deliberately "light desktop, dark terminals" - colors.toml is
# Catppuccin Latte for the shell, GTK and menus, while the terminals stay Mocha.
# Omarchy 4 generates foot.ini from colors.toml, which would make foot light, and
# Quattro made foot the default terminal. A theme-supplied file is used verbatim
# instead of being generated, so this file restores the dark terminal.
#
# Keep in sync with alacritty.toml, ghostty.conf and kitty.conf in this theme.

[colors-dark]
foreground=cdd6f4
background=1e1e2e
selection-foreground=1e1e2e
selection-background=f5e0dc

cursor=1e1e2e f5e0dc

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
