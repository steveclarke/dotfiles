[tools]
bun = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
go = "latest"
node = "lts"
"npm:@usebruno/cli" = "3.4.2"
pnpm = "11"
python = "latest"
ruby = "4"

[settings]
# Skip mise's new-release quarantine for Claude Code and Codex — always take
# the newest versions the moment they ship.
minimum_release_age_excludes = ["claude", "codex"]
node.default_packages_file = "~/.default-npm-packages"
idiomatic_version_file_enable_tools = ["ruby"]

[env]
# Pin baseruby for ruby-build so ./configure doesn't probe $PATH and
# pick up the mise ruby shim, which recurses back into `mise install`.
RUBY_CONFIGURE_OPTS = "--with-baseruby=/usr/bin/ruby"
