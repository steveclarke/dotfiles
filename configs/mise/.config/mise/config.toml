[tools]
bun = "latest"
claude = "latest"
codex = "latest"
dotnet = "latest"
gh = "latest"
go = "latest"
# Java 21 LTS, not latest: AGP 9 / Gradle / Android CLI need 21.
java = "27"
node = "lts"
"npm:@todoist/cli" = "latest"
"npm:@slidev/cli" = "latest"
# Sunra's CLI: the aube npm backend refuses package names under 30 days old
# (first published 2026-10-15), so until 2026-11-14 install it with
# MISE_NPM_PACKAGE_MANAGER=npm mise install npm:@sunra/cli
"npm:@sunra/cli" = "latest"
"npm:@usebruno/cli" = "4.3.0"
# Cloudflare CLI ships only betas; mise "latest" skips prereleases.
"npm:cf" = "1.0.0-beta.27"
"npm:hunkdiff" = "latest"
"npm:playwright" = "latest"
"npm:skills" = "latest"
"npm:yarn" = "latest"
pnpm = "12"
python = "latest"
ruby = "4"

[settings]
# Skip mise's new-release quarantine for Claude Code and Codex — always take
# the newest versions the moment they ship.
minimum_release_age_excludes = ["claude", "codex"]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.upgrade]
auto_prune = false

[env]
# Pin baseruby for ruby-build so ./configure doesn't probe $PATH and
# pick up the mise ruby shim, which recurses back into `mise install`.
RUBY_CONFIGURE_OPTS = "--with-baseruby=/usr/bin/ruby"
