# Steve's Tmux Config
#
# Structure, so upstream merges stay cheap:
#   1. OMARCHY BASE   — byte-identical to the tmux.conf Omarchy ships. Do not
#                       hand-edit. `tmux-upstream-merge` folds their changes in.
#   2. ADDITIONS      — Alt-letter (Zellij-style) bindings, no prefix needed.
#   3. OVERRIDES      — the few Omarchy settings deliberately changed. These come
#                       last so they win.

# =============================================================================
# 1. OMARCHY BASE (verbatim — snapshot in omarchy-upstream/tmux/tmux.conf)
# =============================================================================

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# =============================================================================
# 2. ADDITIONS — Alt-letter (Zellij-style, no prefix needed)
# =============================================================================

# Window/session nav: Alt + h/j/k/l (vim style — high-frequency navigation)
bind -N "Previous window" -n M-h previous-window
bind -N "Next window" -n M-l next-window
bind -N "Previous session" -n M-k switch-client -p
bind -N "Next session" -n M-j switch-client -n

# Split creation: Alt + d (down), Alt + r (right)
bind -N "Split pane vertically" -n M-d split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-r split-window -h -c "#{pane_current_path}"

# Zoom pane toggle
bind -N "Zoom pane" -n M-f resize-pane -Z

# Kill pane
bind -N "Kill pane" -n M-x kill-pane

# Window: new / prev / next
bind -N "Create window" -n M-c new-window -c "#{pane_current_path}"
bind -N "Previous window" -n M-, previous-window
bind -N "Next window" -n M-. next-window

# Pane navigation: Alt + Shift + h/j/k/l (supplement to C-M-Arrows)
bind -N "Focus pane left" -n M-H select-pane -L
bind -N "Focus pane down" -n M-J select-pane -D
bind -N "Focus pane up" -n M-K select-pane -U
bind -N "Focus pane right" -n M-L select-pane -R

# Swap panes spatially
bind -N "Swap pane left" -n S-Left swap-pane -t '{left-of}'
bind -N "Swap pane right" -n S-Right swap-pane -t '{right-of}'
bind -N "Swap pane up" -n S-Up swap-pane -t '{up-of}'
bind -N "Swap pane down" -n S-Down swap-pane -t '{down-of}'

# Scratchpad toggle
bind -N "Toggle scratchpad window" -n M-s if-shell "[ '#{window_name}' = 'scratchpad' ]" \
    "last-window" \
    "if-shell 'tmux select-window -t scratchpad 2>/dev/null' '' 'new-window -n scratchpad'"

# Popup lazygit — closes when lazygit exits (q in lazygit).
bind -N "Lazygit popup" -n M-p display-popup -E -w 80% -h 80% -d "#{pane_current_path}" lazygit

# Copy this pane's id (e.g. %69) to the system clipboard. Hand it to an agent
# (Claude/Codex) so it can read or drive this pane via the tmux CLI.
bind -N "Copy pane id" i run-shell "printf '%s' '#{pane_id}' | (pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null)" \; display-message "copied pane id #{pane_id}"
bind -N "Copy pane id" -n M-i run-shell "printf '%s' '#{pane_id}' | (pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null)" \; display-message "copied pane id #{pane_id}"

# Pane resize via prefix + Arrow (repeatable)
bind -N "Resize pane up" -r Up resize-pane -U 5
bind -N "Resize pane down" -r Down resize-pane -D 5
bind -N "Resize pane left" -r Left resize-pane -L 5
bind -N "Resize pane right" -r Right resize-pane -R 5

# Mnemonic splits: | = vertical bar = horizontal split, - = horizontal bar = vertical split
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"

# Copy-mode word/char jumps (additions to Omarchy's v/y)
bind -N "Next word" -T copy-mode-vi w send -X next-word
bind -N "Previous word" -T copy-mode-vi b send -X previous-word
bind -N "Jump to char" -T copy-mode-vi f send -X jump-to-char
bind -N "Jump back to char" -T copy-mode-vi F send -X jump-to-char -b

# =============================================================================
# 3. OVERRIDES — Omarchy settings deliberately changed. Last, so these win.
# =============================================================================

# Status bar at the bottom, not the top.
set -g status-position bottom

# Per-pane borders with the pane number, which Omarchy's stock config omits.
set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format " #P "
