# See https://wiki.hyprland.org/Configuring/Monitors/
#
# The monitor layout is NOT hand-written here any more. It is managed by
# hyprmoncfg (https://github.com/crmne/hyprmoncfg) — a visual TUI where you drag
# the displays into place. It keys each panel by make/model/serial instead of
# DP port number, and its daemon re-applies the matching profile automatically
# on plug/unplug. Moving between the 3-monitor desk and the 2-monitor setup
# needs no edits to any file.
#
#   hyprmoncfg              open the TUI: drag to arrange, `s` to save a profile
#   hyprmoncfg save <name>  capture the current live layout as a profile
#   hyprmoncfg profiles     list saved profiles
#   hyprmoncfg apply <name> switch by hand
#
# Why ports were the wrong key: this box has been through an RX 7800 XT -> R9700
# swap and two locations. Every swap renamed the connectors (HDMI-A-1 became
# DP-1, and so on), which silently stranded workspaces on monitors that no
# longer existed. Serials never move.

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2

# Keep hyprmoncfg off this file. It writes its target with a temp file + rename,
# which would replace this stow symlink with a regular file and detach it from
# the dotfiles repo. The systemd drop-in for hyprmoncfgd sets the same variable,
# since a user unit does not inherit Hyprland's env.
env = HYPRMONCFG_MONITORS_CONF,/home/steve/.config/hypr/monitors-generated.conf

# Catch-all for any panel with no profile rule yet. Hyprland only falls back to
# this when nothing more specific matches, so it cannot override the generated
# rules below — it just guarantees a new monitor lights up instead of staying
# blank.
monitor = , preferred, auto, 1.333333

# Generated by hyprmoncfg. Machine-specific, deliberately not stowed.
source = ~/.config/hypr/monitors-generated.conf

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
